<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <!-- Neon Green Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(10, 8)">
    <!-- Catuto Geometric Neon Symbol -->
    <g transform="translate(0, 0) scale(0.65)" filter="url(#neonGlow)">
      <!-- Top Diamond 1 -->
      <polygon points="45,5 65,25 45,45 25,25" fill="none" stroke="#00FF41" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />
      
      <!-- Top Diamond 2 (Interlocking) -->
      <polygon points="45,20 65,40 45,60 25,40" fill="none" stroke="#00FF41" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />

      <!-- Lower Outer Loop / Shield Shape -->
      <path d="M 20,48 C 15,58 15,75 25,85 C 35,95 55,95 65,85 C 75,75 75,58 70,48" 
            fill="none" stroke="#00FF41" stroke-width="4.5" stroke-linecap="round" />
      
      <!-- Lower Inner Slash / Geometry -->
      <polygon points="32,75 45,60 55,70 42,85" fill="none" stroke="#00FF41" stroke-width="3.5" stroke-linejoin="round" />
    </g>

    <!-- Text Group -->
    <g transform="translate(68, 8)">
      <!-- CATUTO -->
      <text x="0" y="28" 
            font-family="'Montserrat', 'Inter', sans-serif" 
            font-size="24" 
            font-weight="800" 
            letter-spacing="2.5" 
            fill="#FFFFFF">CATUTO</text>

      <!-- Soluções Digitais -->
      <text x="1" y="46" 
            font-family="'Montserrat', 'Inter', sans-serif" 
            font-size="11" 
            font-weight="400" 
            letter-spacing="1.2" 
            fill="#00FF41">Soluções Digitais</text>
    </g>
  </g>
</svg>
