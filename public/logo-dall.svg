<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>

    <!-- Circuit Cyan to Purple Gradient -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#9B51E0"/>
    </linearGradient>

    <!-- Circuit Purple to Magenta -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#FF0080"/>
    </linearGradient>

    <!-- Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="60%" stop-color="#9B51E0"/>
      <stop offset="100%" stop-color="#FF0080"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />

  <g transform="translate(60, 45)">
    <!-- Circuit 'D' Icon -->
    <g transform="translate(0, 0)">
      <!-- Outer D Line -->
      <path d="M 0 0 L 35 0 C 70 0, 95 25, 95 60 C 95 95, 70 120, 35 120 L 0 120 Z" 
            fill="none" stroke="url(#purpleGrad)" stroke-width="5" stroke-linecap="round"/>
      
      <!-- Inner Circuit Trace 1 -->
      <path d="M 12 18 L 35 18 C 58 18, 76 36, 76 60 C 76 84, 58 102, 35 102 L 12 102 Z" 
            fill="none" stroke="url(#circuitGrad)" stroke-width="4" stroke-linecap="round"/>

      <!-- Inner Circuit Trace 2 (Branching) -->
      <path d="M 22 36 L 38 36 C 50 36, 60 46, 60 60 C 60 74, 50 84, 38 84 L 22 84 Z" 
            fill="none" stroke="url(#purpleGrad)" stroke-width="3" stroke-linecap="round"/>

      <!-- Vertical Circuit Bars & Nodes -->
      <line x1="0" y1="0" x2="0" y2="120" stroke="url(#circuitGrad)" stroke-width="6" stroke-linecap="round"/>
      
      <!-- Branch node lines -->
      <path d="M 0 30 L 25 30 L 35 45" fill="none" stroke="#00F2FE" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="35" cy="45" r="4.5" fill="#00F2FE" filter="url(#glow)"/>

      <path d="M 0 90 L 25 90 L 35 75" fill="none" stroke="#00F2FE" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="35" cy="75" r="4.5" fill="#00F2FE" filter="url(#glow)"/>

      <path d="M 0 60 L 20 60" fill="none" stroke="#00F2FE" stroke-width="3.5"/>
      <circle cx="20" cy="60" r="4.5" fill="#00F2FE" filter="url(#glow)"/>
    </g>

    <!-- Apostrophe ' -->
    <path d="M 108 8 C 112 8, 116 11, 116 16 C 116 23, 108 34, 105 38 C 103 38, 103 36, 105 30 C 103 28, 102 24, 102 18 C 102 12, 105 8, 108 8 Z" 
          fill="#FFFFFF" />

    <!-- Word: ALL -->
    <text x="130" y="98" 
          font-family="'Montserrat', 'Inter', sans-serif" 
          font-size="94" 
          font-weight="300" 
          letter-spacing="10" 
          fill="#FFFFFF">ALL</text>

    <!-- Accent Gradient Line under ALL -->
    <line x1="125" y1="118" x2="495" y2="118" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Subtitle: ENGENHARIA E AUTOMAÇÃO -->
    <text x="4" y="152" 
          font-family="'Montserrat', 'Inter', sans-serif" 
          font-size="21" 
          font-weight="400" 
          letter-spacing="8.5" 
          fill="#FFFFFF">ENGENHARIA E AUTOMAÇÃO</text>
  </g>
</svg>
